<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrays, DOM e Eventos</title>
</head>

<body>

    <h1 id="titulo">Meu Blog</h1>

    <h2>Parágrafos</h2>

    <p class="texto">Este é o primeiro parágrafo.</p>
    <p class="texto">Este é o segundo parágrafo.</p>
    <p class="texto">Este é o terceiro parágrafo.</p>


    <h2>Lista de itens</h2>

    <ul id="lista">
        <li>Primeiro item</li>
        <li>Segundo item</li>

        <!-- Itens usados no Event Delegation -->
        <li>Item de evento 1</li>
        <li>Item de evento 2</li>
        <li>Item de evento 3</li>
    </ul>


    <h2>Botão</h2>

    <button id="botao">Clique aqui</button>


    <h2>Campo de nome</h2>

    <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
    >


    <h2>Adicionar tarefa</h2>

    <form id="formulario">

        <input
            type="text"
            id="tarefa"
            placeholder="Digite uma tarefa"
        >

        <button type="submit">
            Adicionar tarefa
        </button>

    </form>


    <!-- Arquivo JavaScript -->
    <script src="app2.js"></script>

</body>
</html>
